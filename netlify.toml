[build]
  publish = "dist"
  command = "bun run build"

[[redirects]]
  from = "/api/*"
  to = "https://chenify.pythonanywhere.com/:splat"
  status = 200
  force = true
  headers = { "Host" = "chenify.pythonanywhere.com", "Access-Control-Allow-Origin" = "*", "Access-Control-Allow-Methods" = "GET, POST, PUT, DELETE, OPTIONS", "Access-Control-Allow-Headers" = "Content-Type, Authorization" }
